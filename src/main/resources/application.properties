# ==========================================
# Aplicación
# ==========================================
# Nombre lógico usado para identificar esta aplicación Spring Boot.
spring.application.name=xs-sistema-gestion
# Puerto HTTP. Docker o una plataforma en la nube puede sobrescribirlo mediante PORT.
server.port=${PORT:8080}

# ==========================================
# CORS
# ==========================================
# Orígenes web autorizados, separados por comas. Para producción se configura mediante CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://127.0.0.1:4200}

# ==========================================
# PostgreSQL
# ==========================================
# URL JDBC de PostgreSQL formada con el host, puerto y nombre de la base de datos.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:xs_sistema}
# Nombre de usuario de PostgreSQL.
spring.datasource.username=${DB_USERNAME:postgres}
# Contraseña de PostgreSQL. Es obligatoria y debe venir desde las variables de entorno.
spring.datasource.password=${DB_PASSWORD}
# Driver JDBC usado para conectarse a PostgreSQL.
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

# ==========================================
# JPA / Hibernate
# ==========================================
# Estrategia de Hibernate para el esquema. En producción usa validate después de ejecutar bd_schema.sql.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
# Activa el registro de consultas SQL durante el desarrollo local.
spring.jpa.show-sql=${SHOW_SQL:true}
# Dialecto SQL que Hibernate usa para generar consultas compatibles con PostgreSQL.
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# ==========================================
# Pool de conexiones Hikari
# ==========================================
# Consulta usada para validar una conexión a la base de datos antes de utilizarla.
spring.datasource.hikari.connection-test-query=${HIKARI_CONNECTION_TEST_QUERY:SELECT 1}
# Cantidad mínima de conexiones inactivas que se mantienen en el pool.
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:1}
# Cantidad máxima de conexiones a la base de datos permitidas en el pool.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE:10}
# Tiempo en milisegundos antes de que una conexión inactiva pueda eliminarse.
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:30000}
# Identificador usado en los logs para el pool de conexiones Hikari.
spring.datasource.hikari.pool-name=${HIKARI_POOL_NAME:HikariPool}

# ==========================================
# JWT
# ==========================================
# Secreto usado para firmar y validar tokens JWT. Es obligatorio y viene desde las variables de entorno.
app.jwt.secret=${JWT_SECRET}
# Duración de validez del JWT en milisegundos.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ==========================================
# Archivos y perfil de almacenamiento activo
# ==========================================
# Perfil de almacenamiento activo. Local es el valor predeterminado; usa azure solo con sus credenciales.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# Directorio base utilizado por la implementación de almacenamiento local.
app.upload-dir=${UPLOAD_DIR:C:/sistema-gestion/}
# URL base utilizada cuando la aplicación construye enlaces del backend.
app.backend-url=${BACKEND_URL:http://localhost:8080}
# URL base pública utilizada para exponer archivos almacenados.
app.files.public-base-url=${FILES_PUBLIC_BASE_URL:http://localhost:8080/api/files}

# Requerido solo cuando SPRING_PROFILES_ACTIVE=azure.
# Cadena de conexión de Azure Blob Storage.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
# Nombre del contenedor de Azure Blob Storage.
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME}

# Tamaño máximo permitido para un archivo subido.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:100MB}
# Tamaño máximo permitido para la solicitud multipart completa.
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:100MB}

# ==========================================
# Alertas operativas internas
# ==========================================
# Intervalo entre revisiones automáticas de alertas operativas, en milisegundos.
app.notifications.operational-check-interval-ms=${OPERATIONAL_CHECK_INTERVAL_MS:900000}
# Cantidad de días anteriores visibles en el centro de notificaciones.
app.notifications.visible-days=${NOTIFICATIONS_VISIBLE_DAYS:7}
# Espera antes de la primera revisión de alertas operativas al iniciar la aplicación, en milisegundos.
app.notifications.operational-check-initial-delay-ms=${OPERATIONAL_CHECK_INITIAL_DELAY_MS:30000}
# Nivel máximo de stock que genera una alerta de stock bajo.
app.notifications.low-stock-threshold=${LOW_STOCK_THRESHOLD:0}
# Días sin movimientos de inventario antes de notificar sobre un producto sin movimiento.
app.notifications.no-movement-days=${NO_MOVEMENT_DAYS:30}
# Horas que una sesión de caja puede permanecer abierta antes de generar una alerta.
app.notifications.open-cash-hours=${OPEN_CASH_HOURS:24}
# Horas que un conteo de inventario puede permanecer pendiente antes de generar una alerta.
app.notifications.pending-count-hours=${PENDING_COUNT_HOURS:24}
