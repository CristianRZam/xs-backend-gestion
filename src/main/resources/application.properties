# ==========================================
# Nombre de la aplicaci\u00F3n
# ==========================================
spring.application.name=xs-sistema-gestion
#server.port=${PORT:8080}
# ==========================================
# Configuraci\u00F3n de la base de datos PostgreSQL
# ==========================================
# URL de conexi\u00F3n a PostgreSQL en Render con SSL obligatorio
#spring.datasource.url=jdbc:postgresql://dpg-d9s9bsm7bikc7394se3g-a.oregon-postgres.render.com/xs_sistema?sslmode=require
spring.datasource.url=jdbc:postgresql://localhost:5432/xs_sistema

# Usuario y contrase\u00F1a para la base de datos en Render
#spring.datasource.username=xs_sistema_user
#spring.datasource.password=XusWoKtkV4lsCP4xyKZ0RViEyd5DfkRw
spring.datasource.username=postgres
spring.datasource.password=123456

# Driver JDBC para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Configuraci\u00F3n del pool de conexiones Hikari
# ==========================================
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariPool

# ==========================================
# JWT
# ==========================================
app.jwt.secret=WEGOggu9JMI5hWui16a945AG9Pwg3Jx+RYmeH/NrkHShqs2qs6Z6Z9/s+zGUeUJ/2y0nyQXkVhkr6WnI0ywPdw==
app.jwt.expiration-ms=3600000

app.upload-dir=C:/sistema-gestion/
app.backend-url=http://localhost:8080

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==========================
# Configuraci\u00F3n de guardadoi de archivos
# ==========================
spring.profiles.active=local
# ==========================
# Archivos - URL p\u00FAblica
# ==========================
app.files.public-base-url=http://localhost:8080/api/files

# ==========================================
# Alertas operativas internas
# ==========================================
# Tiempo entre cada revisi\u00C3\u00B3n autom\u00C3\u00A1tica de alertas, expresado en milisegundos.
# 900000 ms equivale a 15 minutos.
app.notifications.operational-check-interval-ms=900000
# Espera inicial antes de la primera revisi\u00C3\u00B3n cuando se inicia el backend,
# expresada en milisegundos. 30000 ms equivale a 30 segundos.
app.notifications.operational-check-initial-delay-ms=30000
# Cantidad m\u00C3\u00A1xima de unidades que puede tener un producto para generar
# una alerta de stock bajo.
app.notifications.low-stock-threshold=0
# D\u00C3\u00ADas sin movimientos de inventario despu\u00C3\u00A9s de los cuales un producto
# genera una alerta de producto sin movimiento.
app.notifications.no-movement-days=30
# Horas que una caja puede permanecer abierta antes de generar una alerta.
# 24 horas equivale a un d\u00C3\u00ADa completo.
app.notifications.open-cash-hours=24
# Horas que un conteo abierto o en revisi\u00C3\u00B3n puede permanecer pendiente
# antes de generar una alerta. 24 horas equivale a un d\u00C3\u00ADa completo.
app.notifications.pending-count-hours=24


