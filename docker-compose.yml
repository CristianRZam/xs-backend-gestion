services:

  postgres:
    image: postgres:17
    container_name: dprimera-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    # PostgreSQL NO queda expuesto públicamente.
    # Permite conectarnos mediante túnel SSH desde DBeaver.
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - dprimera_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dprimera-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    # Carga todas las variables definidas en .env
    env_file:
      - .env

    environment:
      PORT: 8080

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Hibernate
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-validate}
      SHOW_SQL: ${SHOW_SQL:-false}

      # Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      # Archivos
      UPLOAD_DIR: /app/uploads/

      # URLs
      BACKEND_URL: ${BACKEND_URL}
      FILES_PUBLIC_BASE_URL: ${FILES_PUBLIC_BASE_URL}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    # Spring Boot NO queda expuesto públicamente.
    # Nginx será quien acceda al backend.
    ports:
      - "127.0.0.1:8080:8080"

    # Los archivos quedan físicamente dentro de
    # /opt/dprimera/uploads en el servidor.
    volumes:
      - ./uploads:/app/uploads


volumes:
  dprimera_postgres_data: